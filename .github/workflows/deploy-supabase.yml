name: Deploy to Supabase

# Applies migrations and deploys Edge Functions.
#
# This exists so the backend can be deployed from a browser: the two secrets
# below live in GitHub repo settings, never in a file, a shell command, or a
# chat transcript. Pushing to main is the whole workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  Supabase account -> Access Tokens -> Generate new
#   SUPABASE_PROJECT_REF   Project Settings -> General -> Reference ID
#
# There is deliberately NO database password. Migrations used to go through
# `supabase db push`, which needs one, and it failed with 28P01 on every
# attempt for weeks -- fresh passwords, session pooler, URL-encoding,
# whitespace trimming, an explicit connection-string override. Both halves
# now authenticate with the same access token, via the Management API for
# SQL and the CLI for functions. One credential, and one that is proven to
# work on every run.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/apply-migrations-api.mjs'
      - '.github/workflows/deploy-supabase.yml'
  # Lets you re-run it from the Actions tab without pushing anything.
  workflow_dispatch:
    inputs:
      migrations_only:
        description: 'Apply migrations but skip deploying functions'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Everything at or below this version was applied by hand through the
      # SQL editor before the API path existed. The script RECORDS these as
      # applied rather than re-running them, and only when the schema is
      # already initialised -- a fresh project still runs the lot.
      MIGRATIONS_BASELINE: '20260823001500'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "Missing repo secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Both secrets present."

      # Where any SQL problem surfaces. Each file is applied in its own
      # transaction with its bookkeeping row, so a failure rolls that file
      # back and the run is safe to repeat after a fix.
      - name: Apply migrations
        run: node scripts/apply-migrations-api.mjs

      # No build step: the shared fee/score bundle at
      # supabase/functions/_shared/outcome-shared.mjs is committed precisely so
      # the functions deploy straight from source.
      #
      # `!cancelled()` lets functions deploy even when migrations failed -- the
      # job still reports failure, but a SQL error no longer holds up the half
      # that has nothing to do with it.
      - name: Deploy Edge Functions
        if: ${{ !inputs.migrations_only && !cancelled() }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Supabase deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Functions deployed to \`$SUPABASE_PROJECT_REF\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Still to do by hand in the dashboard, once:" >> $GITHUB_STEP_SUMMARY
          echo "- Vault secrets: \`project_url\`, \`service_role_key\`, \`cron_secret\`" >> $GITHUB_STEP_SUMMARY
          echo "- Edge Function secret: \`CRON_SECRET\` (must match Vault)" >> $GITHUB_STEP_SUMMARY
