name: Verify

# Guards the invariants that carry money. Runs on every push and PR.
#
# The shared tests are the important ones: they pin the fee rule (20% of net,
# losses offsetting wins, a losing month owing nothing) and the settlement
# allocation that keeps a member's billed PnL equal to their real PnL.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # packages/shared/dist is gitignored, so it has to be built before
      # anything imports it. This also emits the Deno bundle the Edge
      # Functions use, which IS committed — CI regenerating it is how a
      # drifted bundle would show up as a dirty tree below.
      - name: Build shared package
        run: npm run build:shared

      - name: Shared package — fee and score invariants
        run: npm run test -w @outcome/shared

      - name: Committed Deno bundle matches packages/shared source
        run: |
          if ! git diff --quiet -- supabase/functions/_shared/; then
            echo "The committed Edge Function bundle is stale."
            echo "Run: npm run build:shared   and commit the result."
            git diff --stat -- supabase/functions/_shared/
            exit 1
          fi
          echo "Bundle is in sync."

      - name: Admin dashboard — build and typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build -w @outcome/admin

      - name: Member app — typecheck
        run: npm run typecheck -w @outcome/member
